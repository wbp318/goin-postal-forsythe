name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The scripts stop unless an owner key is present. Forks do not get this secret.
env:
  GOIN_POSTAL_OWNER: ${{ secrets.GOIN_POSTAL_OWNER }}

jobs:
  code:
    name: Check the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # Astro 7 wants 22.23.4 or newer; the 22 line on the runners lagged behind it
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the site's packages
        working-directory: site
        run: npm ci
      - name: Type-check every page, API and library file
        working-directory: site
        run: npm run check
      - name: Run the unit tests
        working-directory: site
        run: npm run test:unit
      - name: Build the site the way Cloudflare does
        working-directory: site
        run: npm run build
      - name: Syntax-check the printer agent
        run: node --check shipping-client/printer-agent/agent.mjs
      - name: Syntax-check the Python scripts
        run: python -m py_compile scripts/*.py
      - name: Check the database schema parses
        run: |
          python - <<'EOF'
          import sqlite3
          sql = open('site/db/schema.sql', encoding='utf-8').read()
          con = sqlite3.connect(':memory:'); con.executescript(sql); con.executescript(sql)  # re-runnable
          print('schema ok, re-runnable')
          EOF

  designs:
    name: Check designs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SVGs, PNG exports, README and gallery
        run: python scripts/check_designs.py

  export:
    name: Export PNG and PDF
    needs: designs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render every design with Chrome
        run: python scripts/export_designs.py --out build --browser google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: goin-postal-designs
          path: build/
          retention-days: 30

  mermaid:
    name: Render Mermaid charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract diagrams from README and plan page
        run: python scripts/extract_mermaid.py build/mermaid
      - name: Render each diagram
        run: |
          echo '{"args":["--no-sandbox"]}' > puppeteer.json
          for f in build/mermaid/*.mmd; do
            echo "::group::$f"
            npx -y @mermaid-js/mermaid-cli@11 -p puppeteer.json -i "$f" -o "${f%.mmd}.svg"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-charts
          path: build/mermaid/
          retention-days: 30
