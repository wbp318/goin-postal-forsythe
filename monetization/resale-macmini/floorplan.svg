<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-label="Plan view of a 12 by 10 foot resale workroom: items come in at the door, are photographed, measured and weighed, drafted and labeled at the Mac mini desk, shelved by SKU, packed, and handed to the shipping counter's carrier pickups. Numbered arrows show the order.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17202d"/>
    </marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9ced8" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#17202d">
    <text x="40" y="38" font-size="20" font-weight="700">Resale workroom: plan view</text>
    <text x="40" y="60" font-size="13" fill="#4a5568">Drawn to scale, 1 ft = 60 px, on an assumed 12 ft x 10 ft back room. Measure the real room first; the order of the stations is what matters.</text>

    <!-- room walls 12 x 10 ft = 720 x 600 at (120,100) -->
    <rect x="120" y="100" width="720" height="600" fill="none" stroke="#17202d" stroke-width="10"/>
    <!-- door to store front, bottom wall, 3 ft -->
    <rect x="160" y="694" width="180" height="12" fill="#ffffff"/>
        <text x="250" y="728" font-size="12" text-anchor="middle">Opening to the shipping counter (3 ft)</text>

    <!-- 1 intake bins by door: 3 x 2 ft -->
    <rect x="132" y="560" width="120" height="120" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="192" y="606" font-size="13" text-anchor="middle" font-weight="700">1 Intake</text>
    <text x="192" y="624" font-size="11" text-anchor="middle">bins of new buys,</text>
    <text x="192" y="639" font-size="11" text-anchor="middle">not yet SKU'd</text>

    <!-- 2 photo station: 4 x 2.5 ft table with sweep, along left wall -->
    <rect x="132" y="150" width="150" height="240" fill="#fff8e1" stroke="#3b2c00" stroke-width="1.5"/>
    <rect x="132" y="150" width="40" height="240" fill="#ffffff" stroke="#3b2c00" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="152" y="140" font-size="10.5" text-anchor="middle">white sweep</text>
    <text x="226" y="262" font-size="13" text-anchor="middle" font-weight="700">2 Photos</text>
    <text x="226" y="280" font-size="11" text-anchor="middle">phone on a tripod</text>
    <circle cx="300" cy="170" r="12" fill="#f2b705" stroke="#3b2c00"/>
    <circle cx="300" cy="370" r="12" fill="#f2b705" stroke="#3b2c00"/>
    <text x="318" y="174" font-size="10.5">light</text>
    <text x="318" y="374" font-size="10.5">light</text>
    <!-- mannequin / hanger -->
    <circle cx="226" cy="330" r="16" fill="none" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="226" y="360" font-size="10.5" text-anchor="middle">form / hanger</text>

    <!-- 3 measure & weigh: 3 x 2 ft along top wall -->
    <rect x="360" y="112" width="180" height="120" fill="#fff8e1" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="450" y="160" font-size="13" text-anchor="middle" font-weight="700">3 Measure, weigh</text>
    <rect x="380" y="180" width="50" height="36" fill="#f2b705" stroke="#3b2c00"/>
    <text x="405" y="203" font-size="10" text-anchor="middle">scale</text>
    <text x="490" y="203" font-size="10.5" text-anchor="middle">tape, flat-lay</text>

    <!-- 4 listing desk: 5 x 2.5 ft along top wall right -->
    <rect x="570" y="112" width="260" height="150" fill="#fff8e1" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="700" y="140" font-size="13" text-anchor="middle" font-weight="700">4 Listing desk</text>
    <rect x="640" y="152" width="120" height="12" fill="#f2b705" stroke="#3b2c00"/>
    <text x="700" y="178" font-size="10.5" text-anchor="middle">monitor: Obsidian, the drafts</text>
    <rect x="600" y="196" width="25" height="25" rx="4" fill="#f2b705" stroke="#3b2c00"/>
    <text x="612" y="238" font-size="10.5" text-anchor="middle">Mac mini</text>
    <rect x="760" y="192" width="45" height="40" fill="#f2b705" stroke="#3b2c00"/>
    <text x="782" y="248" font-size="10.5" text-anchor="middle">SKU label printer</text>
    <text x="700" y="214" font-size="10.5" text-anchor="middle">approve, print SKU</text>

    <!-- 5 shelving: two 4 ft x 1.5 ft units along right wall -->
    <rect x="740" y="300" width="90" height="240" fill="#f4f5f7" stroke="#17202d" stroke-width="1.5"/>
    <g stroke="#17202d" stroke-width="1">
      <line x1="740" y1="360" x2="830" y2="360"/>
      <line x1="740" y1="420" x2="830" y2="420"/>
      <line x1="740" y1="480" x2="830" y2="480"/>
    </g>
    <text x="785" y="335" font-size="11" text-anchor="middle">A bins</text>
    <text x="785" y="395" font-size="11" text-anchor="middle">B bins</text>
    <text x="785" y="455" font-size="11" text-anchor="middle">C bins</text>
    <text x="785" y="515" font-size="11" text-anchor="middle">D bins</text>
    <text x="720" y="420" font-size="13" text-anchor="end" font-weight="700">5 Shelves</text>
    <text x="720" y="438" font-size="11" text-anchor="end">listed items,</text>
    <text x="720" y="453" font-size="11" text-anchor="end">by SKU (A-014)</text>

    <!-- 6 packing table: 5 x 2.5 ft center bottom -->
    <rect x="400" y="540" width="300" height="150" fill="#fff8e1" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="550" y="590" font-size="13" text-anchor="middle" font-weight="700">6 Pack</text>
    <text x="550" y="608" font-size="11" text-anchor="middle">store's boxes and fill underneath;</text>
    <text x="550" y="623" font-size="11" text-anchor="middle">PeterShip label prints at the counter</text>

    <!-- 7 outbound by door -->
    <rect x="272" y="600" width="100" height="80" fill="#0f1d3a" fill-opacity="0.12" stroke="#0f1d3a" stroke-width="1.5"/>
    <text x="322" y="636" font-size="12" text-anchor="middle" font-weight="700" fill="#0f1d3a">7 Outbound</text>
    <text x="322" y="652" font-size="10.5" text-anchor="middle" fill="#0f1d3a">to carrier pickups</text>

    <!-- flow arrows -->
    <g stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M192,556 L210,400"/>
      <path d="M290,250 C330,230 340,190 356,180"/>
      <path d="M544,170 L566,180"/>
      <path d="M760,266 L780,296"/>
      <path d="M740,520 C700,540 710,560 704,566"/>
      <path d="M396,640 L376,640"/>
    </g>
    <text x="40" y="770" font-size="12" fill="#1d4ed8">Blue arrows: the path an item takes, 1 to 7. Every item gets its SKU label at step 4 and is never on a shelf without one.</text>

    <!-- dimensions -->
    <line x1="120" y1="86" x2="840" y2="86" stroke="#17202d" stroke-width="1" marker-start="url(#d)" marker-end="url(#d)"/>
    <text x="480" y="80" font-size="11" text-anchor="middle">12 ft</text>
    <line x1="866" y1="100" x2="866" y2="700" stroke="#17202d" stroke-width="1" marker-start="url(#d)" marker-end="url(#d)"/>
    <text x="874" y="404" font-size="11">10 ft</text>

    <!-- scale bar -->
    <g transform="translate(700,732)">
      <rect x="0" y="0" width="60" height="8" fill="#17202d"/>
      <rect x="60" y="0" width="60" height="8" fill="#ffffff" stroke="#17202d"/>
      <rect x="120" y="0" width="60" height="8" fill="#17202d"/>
      <text x="0" y="24" font-size="11">0</text>
      <text x="60" y="24" font-size="11" text-anchor="middle">1 ft</text>
      <text x="120" y="24" font-size="11" text-anchor="middle">2 ft</text>
      <text x="180" y="24" font-size="11" text-anchor="middle">3 ft</text>
    </g>
    <text x="40" y="795" font-size="11.5" fill="#4a5568">Yellow: work surfaces and equipment. Grey: shelving. Navy: what leaves the room. Light blue: what comes in.</text>
  </g>
</svg>
