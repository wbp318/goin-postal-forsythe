<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-label="Plan view of the deposit station at the end of the counter: Mac mini, monitors, scanner and receipt printer on the counter; the deposit drawer, drop safe, firewall and battery under it; the cashier behind, the customer in front, and a camera covering the drawer, the safe and the customer's hands.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17202d"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9ced8" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="760" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#17202d">
    <text x="40" y="38" font-size="20" font-weight="700">Deposit station at the end of the counter: plan view</text>
    <text x="40" y="60" font-size="13" fill="#4a5568">Drawn to scale, 1 ft = 70 px, on an assumed 6 ft x 2 ft counter end. Measure the real counter before buying anything.</text>

    <!-- back wall -->
    <rect x="160" y="84" width="560" height="14" fill="url(#hatch)" stroke="#17202d" stroke-width="1.5"/>
    <text x="440" y="80" font-size="12" text-anchor="middle" fill="#4a5568">Back wall</text>
    <!-- wall jack -->
    <rect x="566" y="98" width="16" height="10" fill="#0f1d3a"/>
    <text x="558" y="122" font-size="11" text-anchor="end" fill="#4a5568">Ethernet jack (store router)</text>

    <!-- rest of counter (POS) -->
    <rect x="40" y="300" width="210" height="140" fill="#f4f5f7" stroke="#17202d" stroke-width="1.5"/>
    <text x="145" y="365" font-size="13" text-anchor="middle" fill="#4a5568">Rest of the counter</text>
    <text x="145" y="383" font-size="13" text-anchor="middle" fill="#4a5568">Goin' Postal POS</text>
    <!-- partition -->
    <rect x="250" y="292" width="8" height="156" fill="#17202d"/>
    <text x="254" y="286" font-size="11" text-anchor="middle" fill="#4a5568">Divider</text>

    <!-- station counter 6 ft x 2 ft = 420 x 140 -->
    <rect x="258" y="300" width="420" height="140" fill="#fff8e1" stroke="#17202d" stroke-width="2"/>

    <!-- UNDER COUNTER (dashed) -->
    <!-- drop safe 14 x 14 in = 82 x 82 -->
    <rect x="272" y="306" width="82" height="82" fill="#0f1d3a" fill-opacity="0.12" stroke="#0f1d3a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="313" y="340" font-size="12" text-anchor="middle" font-weight="700" fill="#0f1d3a">Drop safe</text>
    <text x="313" y="355" font-size="10.5" text-anchor="middle" fill="#0f1d3a">bolted to floor</text>
    <text x="313" y="368" font-size="10.5" text-anchor="middle" fill="#0f1d3a">slot faces cashier</text>
    <!-- deposit drawer 16 x 16 in = 93 x 93 under printer -->
    <rect x="380" y="306" width="93" height="93" fill="#0f1d3a" fill-opacity="0.12" stroke="#0f1d3a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="426" y="386" font-size="12" text-anchor="middle" font-weight="700" fill="#0f1d3a">Deposit drawer</text>
    <!-- firewall + battery on under shelf -->
    <rect x="590" y="352" width="76" height="34" fill="#f2b705" fill-opacity="0.35" stroke="#3b2c00" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="628" y="373" font-size="10.5" text-anchor="middle">Firewall</text>
    <rect x="590" y="392" width="76" height="40" fill="#f2b705" fill-opacity="0.35" stroke="#3b2c00" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="628" y="416" font-size="10.5" text-anchor="middle">Battery backup</text>

    <!-- ON COUNTER (solid) -->
    <!-- staff monitor 20 in wide -->
    <rect x="392" y="308" width="117" height="12" fill="#f2b705" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="450" y="290" font-size="11" text-anchor="middle">Staff monitor (faces cashier)</text>
    <!-- receipt printer 6 x 8 in = 35 x 47 -->
    <rect x="408" y="330" width="35" height="47" fill="#f2b705" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="426" y="358" font-size="9.5" text-anchor="middle">Printer</text>
    <!-- mac mini 5 x 5 in = 29 -->
    <rect x="526" y="334" width="29" height="29" rx="4" fill="#f2b705" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="540" y="378" font-size="10.5" text-anchor="middle">Mac mini</text>
    <!-- scanner 4 x 4 in = 23 -->
    <rect x="484" y="392" width="23" height="23" rx="3" fill="#f2b705" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="496" y="430" font-size="10.5" text-anchor="middle">Scanner</text>
    <!-- customer monitor at front edge 15 in -->
    <rect x="530" y="424" width="88" height="10" fill="#f2b705" stroke="#3b2c00" stroke-width="1.5"/>
    <text x="574" y="452" font-size="11" text-anchor="middle">Customer monitor (faces out)</text>

    <!-- cable to wall -->
    <polyline points="628,352 628,250 574,250 574,108" fill="none" stroke="#0f1d3a" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="636" y="246" font-size="10.5" fill="#4a5568">one cable out</text>

    <!-- counter front edge label -->
    <text x="468" y="470" font-size="13" text-anchor="middle" font-weight="700">Counter front: "Cash deposits" sign</text>

    <!-- people -->
    <circle cx="440" cy="220" r="26" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="440" y="224" font-size="12" text-anchor="middle">Cashier</text>
    <circle cx="468" cy="560" r="26" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="468" y="564" font-size="12" text-anchor="middle">Customer</text>
    <line x1="468" y1="532" x2="468" y2="478" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- camera at back corner with view cone -->
    <polygon points="700,104 300,470 640,600" fill="#1d4ed8" fill-opacity="0.07" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="690" y="98" width="22" height="14" fill="#1d4ed8"/>
    <text x="712" y="160" font-size="11" text-anchor="end" fill="#1d4ed8">Camera: drawer, safe,</text><text x="712" y="174" font-size="11" text-anchor="end" fill="#1d4ed8">customer's hands</text>

    <!-- aisle dimension -->
    <line x1="740" y1="98" x2="740" y2="300" stroke="#17202d" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="748" y="204" font-size="11">about 3 ft aisle</text>
    <!-- counter dimension -->
    <line x1="258" y1="488" x2="678" y2="488" stroke="#17202d" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="330" y="504" font-size="11" text-anchor="middle">6 ft</text>
    <line x1="690" y1="300" x2="690" y2="440" stroke="#17202d" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="698" y="374" font-size="11">2 ft</text>

    <!-- scale bar -->
    <g transform="translate(40,640)">
      <rect x="0" y="0" width="70" height="8" fill="#17202d"/>
      <rect x="70" y="0" width="70" height="8" fill="#ffffff" stroke="#17202d"/>
      <rect x="140" y="0" width="70" height="8" fill="#17202d"/>
      <text x="0" y="24" font-size="11">0</text>
      <text x="70" y="24" font-size="11" text-anchor="middle">1 ft</text>
      <text x="140" y="24" font-size="11" text-anchor="middle">2 ft</text>
      <text x="210" y="24" font-size="11" text-anchor="middle">3 ft</text>
    </g>

    <!-- legend -->
    <g transform="translate(330,620)" font-size="12">
      <rect x="0" y="0" width="22" height="14" fill="#f2b705" stroke="#3b2c00"/>
      <text x="30" y="12">Station equipment, on the counter</text>
      <rect x="0" y="24" width="22" height="14" fill="#f2b705" fill-opacity="0.35" stroke="#3b2c00" stroke-dasharray="6 4"/>
      <text x="30" y="36">Under the counter (dashed)</text>
      <rect x="290" y="0" width="22" height="14" fill="#0f1d3a" fill-opacity="0.12" stroke="#0f1d3a" stroke-dasharray="6 4"/>
      <text x="320" y="12">Where the cash is held</text>
      <circle cx="301" cy="31" r="8" fill="#e8f1fb" stroke="#1d4ed8"/>
      <text x="320" y="36">People</text>
      <rect x="0" y="48" width="22" height="14" fill="#1d4ed8" fill-opacity="0.07" stroke="#1d4ed8" stroke-dasharray="4 4"/>
      <text x="30" y="60">What the camera sees</text>
    </g>
    <text x="40" y="735" font-size="11.5" fill="#4a5568">Sizes: Mac mini 5 x 5 in, receipt printer about 6 x 8 in, cash drawer 16 x 16 in, drop safe about 14 x 14 in footprint, 20 in staff monitor, 15 in customer monitor.</text>
  </g>
</svg>
