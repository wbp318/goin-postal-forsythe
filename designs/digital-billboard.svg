<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400">
  <title>Goin' Postal Forsythe - Digital Bulletin (Holiday Tape)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; letter-spacing: 2px; }
  </style>

  <!-- Ground: solid navy for LED contrast -->
  <rect x="0" y="0" width="1400" height="400" fill="#0f1d3a"/>

  <!-- Line 1 -->
  <text class="d8" x="56" y="150" font-size="130" fill="#ffffff">HOLIDAY BOXES?</text>

  <!-- The one bold move: a strip of kraft packing tape carrying line 2 -->
  <g transform="rotate(-1.5 485 240)">
    <polygon fill="#b98a55" points="-20,176 990,176 978,192 992,208 978,224 992,240 978,256 992,272 978,288 990,304 -20,304"/>
    <rect x="-20" y="182" width="996" height="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="-20" y="294" width="996" height="3" fill="#3b2c00" fill-opacity="0.25"/>
    <text class="d8" x="56" y="283" font-size="130" fill="#0f1d3a" textLength="880" lengthAdjust="spacingAndGlyphs">WE'VE GOT TAPE.</text>
  </g>

  <!-- Location -->
  <text class="d6" x="56" y="362" font-size="34" fill="#f2b705">Forsythe Ave &amp; N 18th St · Monroe</text>

  <!-- Quiet divider -->
  <rect x="1008" y="56" width="3" height="306" fill="#1d4ed8"/>

  <!-- Logo slot (official logo to be placed by owners) -->
  <rect x="1040" y="56" width="304" height="150" fill="#0f1d3a" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/>
  <text class="mono" x="1192" y="137" font-size="18" fill="#ffffff" text-anchor="middle">OFFICIAL LOGO</text>

  <!-- Services -->
  <text class="d6" x="1040" y="320" font-size="26" fill="#ffffff">UPS · FedEx · DHL · USPS</text>
  <text class="d6" x="1040" y="362" font-size="26" fill="#f2b705">Packing · Mailboxes</text>
</svg>
