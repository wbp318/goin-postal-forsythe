<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 300" width="2400" height="300">
  <title>Goin' Postal Forsythe - Monroe Moccasins dasher board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .display { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .display-600 { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .mono { font-family: 'IBM Plex Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; }
  </style>

  <!-- Dark field -->
  <rect x="0" y="0" width="2400" height="300" fill="#0f1d3a"/>

  <!-- Logo slot (reserved for official Goin' Postal logo) -->
  <rect x="96" y="60" width="300" height="180" fill="#0f1d3a" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="246" y="157" class="mono" font-size="20" letter-spacing="2" text-anchor="middle" fill="#ffffff">OFFICIAL LOGO</text>

  <!-- Bold move: the slapshot streak -->
  <rect x="450" y="186" width="1120" height="5" fill="#f2b705"/>
  <rect x="740" y="196" width="860" height="5" fill="#f2b705" fill-opacity="0.7"/>
  <rect x="1040" y="206" width="580" height="5" fill="#f2b705" fill-opacity="0.45"/>
  <ellipse cx="1676" cy="198" rx="40" ry="14" fill="#17202d" stroke="#ffffff" stroke-width="3"/>

  <!-- Headline, one line -->
  <text x="446" y="166" class="display" font-size="112" letter-spacing="1" fill="#ffffff">SHIP IT LIKE A <tspan fill="#f2b705">SLAPSHOT.</tspan></text>

  <!-- Services -->
  <text x="450" y="254" class="mono" font-size="24" letter-spacing="1.5" fill="#ffffff">SHIPPING <tspan fill="#f2b705">/</tspan> UPS · FEDEX · DHL · USPS <tspan fill="#f2b705">/</tspan> PACKING <tspan fill="#f2b705">/</tspan> MAILBOXES</text>

  <!-- Location panel, yellow, bleeds off right edge -->
  <polygon points="1790,0 2400,0 2400,300 1750,300" fill="#f2b705"/>
  <text x="2304" y="66" class="mono" font-size="20" letter-spacing="1.5" text-anchor="end" fill="#3b2c00">NOW OPEN · Goin' Postal · Forsythe</text>
  <text x="2304" y="134" class="display" font-size="56" text-anchor="end" fill="#3b2c00">FORSYTHE AVE &amp;</text>
  <text x="2304" y="192" class="display" font-size="56" text-anchor="end" fill="#3b2c00">N 18TH ST · MONROE</text>
  <rect x="1880" y="218" width="424" height="2" fill="#3b2c00"/>
  <text x="2304" y="254" class="mono" font-size="20" letter-spacing="1" text-anchor="end" fill="#3b2c00">SHOW CODE <tspan fill="#0f1d3a" font-size="22">MOCS10</tspan> AT THE COUNTER</text>
</svg>
