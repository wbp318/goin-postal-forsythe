<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>Proud Local Sponsor seal, Forsythe Ave &amp; N 18th St, Monroe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .disp { font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .disp6 { font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .mono { font-family: 'IBM Plex Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; }
  </style>
  <defs>
    <!-- Postage-stamp perforation: 60 round holes punched through the rim -->
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect x="0" y="0" width="1000" height="1000" fill="#000000"/>
      <circle cx="500" cy="500" r="460" fill="#ffffff"/>
      <circle cx="500" cy="500" r="460" fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round" stroke-dasharray="0 1" pathLength="60"/>
    </mask>
    <!-- Top arc: clockwise, text sits outside baseline -->
    <path id="arcTop" d="M 135 500 A 365 365 0 0 1 865 500" fill="none"/>
    <!-- Bottom arc: counter-clockwise, text sits inside baseline, reads upright -->
    <path id="arcBot" d="M 90 500 A 410 410 0 0 0 910 500" fill="none"/>
  </defs>

  <!-- Stamp body -->
  <circle cx="500" cy="500" r="460" fill="#0f1d3a" mask="url(#perf)"/>
  <circle cx="500" cy="500" r="428" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="500" cy="500" r="340" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Arc lettering: the corner and the city -->
  <text class="disp" font-size="60" letter-spacing="4" fill="#ffffff">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">FORSYTHE AVE &amp; N 18TH ST</textPath>
  </text>
  <text class="disp6" font-size="58" letter-spacing="7" fill="#ffffff">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">MONROE · LOUISIANA</textPath>
  </text>

  <!-- Arc separators at 9 and 3 o'clock -->
  <circle cx="112" cy="500" r="10" fill="#f2b705"/>
  <circle cx="888" cy="500" r="10" fill="#f2b705"/>

  <!-- Signal-yellow stamp face -->
  <circle cx="500" cy="500" r="318" fill="#f2b705"/>
  <circle cx="500" cy="500" r="300" fill="none" stroke="#0f1d3a" stroke-width="3"/>

  <!-- Center lockup -->
  <text class="mono" x="500" y="300" font-size="20" letter-spacing="3" text-anchor="middle" fill="#3b2c00">GOIN' POSTAL · FORSYTHE</text>
  <text class="disp" x="500" y="445" font-size="140" letter-spacing="4" text-anchor="middle" fill="#0f1d3a">PROUD</text>
  <text class="disp" x="500" y="570" font-size="140" letter-spacing="4" text-anchor="middle" fill="#0f1d3a">LOCAL</text>
  <rect x="380" y="594" width="240" height="4" fill="#0f1d3a"/>
  <text class="disp" x="500" y="690" font-size="92" letter-spacing="10" text-anchor="middle" fill="#1d4ed8">SPONSOR</text>
  <text class="mono" x="500" y="730" font-size="16" letter-spacing="1.5" text-anchor="middle" fill="#3b2c00">SHIPPING · PACKING · MAILBOXES</text>
</svg>
