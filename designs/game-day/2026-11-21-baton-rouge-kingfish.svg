<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>Game Day: Moccasins vs. Baton Rouge Kingfish, Sat Nov 21: Goin' Postal Forsythe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .sans { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .sans6 { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; letter-spacing: 2px; }
  </style>

  <!-- Ground -->
  <rect x="0" y="0" width="1080" height="1350" fill="#0f1d3a"/>

  <!-- The label -->
  <rect x="60" y="60" width="960" height="1230" fill="#ffffff" stroke="#17202d" stroke-width="6"/>

  <!-- Packing tape across top edge (quiet kraft detail) -->
  <rect x="440" y="36" width="200" height="56" fill="#b98a55" fill-opacity="0.85"/>
  <rect x="440" y="36" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>
  <rect x="440" y="88" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>

  <!-- ROW A: FROM + logo slot -->
  <text x="100" y="128" class="mono" font-size="20" fill="#1d4ed8">FROM</text>
  <text x="100" y="172" class="sans6" font-size="32" fill="#17202d">Goin' Postal · Forsythe</text>
  <text x="100" y="212" class="sans" font-size="25" fill="#17202d">Forsythe Ave &amp; N 18th St · Monroe</text>

  <rect x="690" y="100" width="290" height="120" fill="#ffffff" stroke="#17202d" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="835" y="167" class="mono" font-size="18" fill="#17202d" text-anchor="middle">OFFICIAL LOGO</text>

  <rect x="60" y="247" width="960" height="6" fill="#17202d"/>

  <!-- ROW B: SHIP TO / matchup -->
  <text x="100" y="292" class="mono" font-size="20" fill="#1d4ed8">SHIP TO</text>
  <text x="100" y="356" class="d6" font-size="64" fill="#17202d" textLength="880" lengthAdjust="spacingAndGlyphs">MOCCASINS VS. BATON ROUGE KINGFISH</text>

  <rect x="60" y="377" width="960" height="6" fill="#17202d"/>

  <!-- ROW C: the one bold move -->
  <rect x="60" y="383" width="960" height="274" fill="#f2b705"/>
  <text x="96" y="604" class="d8" font-size="240" fill="#3b2c00" textLength="880" lengthAdjust="spacingAndGlyphs">GAME DAY</text>

  <rect x="60" y="657" width="960" height="6" fill="#17202d"/>

  <!-- ROW D: date / venue -->
  <text x="100" y="706" class="mono" font-size="20" fill="#1d4ed8">SERVICE DATE · DELIVER TO</text>
  <text x="100" y="770" class="d6" font-size="50" fill="#17202d" textLength="844" lengthAdjust="spacingAndGlyphs">SAT NOV 21 · 7:05 PM · MONROE CIVIC CENTER</text>

  <rect x="60" y="797" width="960" height="6" fill="#17202d"/>

  <!-- ROW E: tracking barcode + promo code -->
  <rect x="100" y="836" width="8" height="150" fill="#17202d"/><rect x="112" y="836" width="4" height="150" fill="#17202d"/><rect x="124" y="836" width="4" height="150" fill="#17202d"/><rect x="132" y="836" width="12" height="150" fill="#17202d"/><rect x="148" y="836" width="4" height="150" fill="#17202d"/><rect x="160" y="836" width="8" height="150" fill="#17202d"/><rect x="172" y="836" width="4" height="150" fill="#17202d"/><rect x="180" y="836" width="4" height="150" fill="#17202d"/><rect x="192" y="836" width="8" height="150" fill="#17202d"/><rect x="204" y="836" width="12" height="150" fill="#17202d"/><rect x="220" y="836" width="4" height="150" fill="#17202d"/><rect x="232" y="836" width="4" height="150" fill="#17202d"/><rect x="240" y="836" width="8" height="150" fill="#17202d"/><rect x="252" y="836" width="4" height="150" fill="#17202d"/><rect x="264" y="836" width="12" height="150" fill="#17202d"/><rect x="280" y="836" width="8" height="150" fill="#17202d"/><rect x="292" y="836" width="4" height="150" fill="#17202d"/><rect x="304" y="836" width="4" height="150" fill="#17202d"/><rect x="312" y="836" width="4" height="150" fill="#17202d"/><rect x="320" y="836" width="8" height="150" fill="#17202d"/><rect x="336" y="836" width="12" height="150" fill="#17202d"/><rect x="352" y="836" width="4" height="150" fill="#17202d"/><rect x="360" y="836" width="8" height="150" fill="#17202d"/><rect x="376" y="836" width="4" height="150" fill="#17202d"/><rect x="384" y="836" width="4" height="150" fill="#17202d"/><rect x="392" y="836" width="12" height="150" fill="#17202d"/><rect x="412" y="836" width="4" height="150" fill="#17202d"/><rect x="420" y="836" width="8" height="150" fill="#17202d"/><rect x="432" y="836" width="8" height="150" fill="#17202d"/><rect x="448" y="836" width="4" height="150" fill="#17202d"/><rect x="456" y="836" width="12" height="150" fill="#17202d"/><rect x="472" y="836" width="4" height="150" fill="#17202d"/><rect x="484" y="836" width="8" height="150" fill="#17202d"/><rect x="496" y="836" width="4" height="150" fill="#17202d"/>
  <text x="100" y="1030" class="mono" font-size="20" fill="#17202d">TRK  0318 1801 MOCS10</text>

  <rect x="557" y="803" width="6" height="274" fill="#17202d"/>

  <text x="600" y="850" class="mono" font-size="20" fill="#1d4ed8">PROMO CODE</text>
  <text x="596" y="972" class="d8" font-size="120" fill="#0f1d3a" textLength="320" lengthAdjust="spacingAndGlyphs">MOCS10</text>
  <text x="600" y="1018" class="sans" font-size="24" fill="#17202d">One per customer.</text>
  <text x="600" y="1050" class="sans" font-size="24" fill="#17202d">Name + phone required.</text>

  <rect x="60" y="1077" width="960" height="6" fill="#17202d"/>

  <!-- ROW F: services -->
  <text x="100" y="1128" class="mono" font-size="20" fill="#1d4ed8">SERVICES</text>
  <text x="100" y="1196" class="d8" font-size="56" fill="#0f1d3a" textLength="660" lengthAdjust="spacingAndGlyphs">SHIPPING · PACKING · MAILBOXES</text>
  <text x="100" y="1246" class="mono" font-size="24" fill="#17202d">UPS · FEDEX · DHL · USPS</text>
  <text x="980" y="1246" class="mono" font-size="16" fill="#17202d" text-anchor="end">PKG 1 OF 1</text>
</svg>
