<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="2400" height="1103" viewBox="0 0 2400 1103">
  <title>Goin' Postal Forsythe - Poster Billboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .mono { font-family: 'IBM Plex Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; }
  </style>

  <!-- Field -->
  <rect x="0" y="0" width="2400" height="1103" fill="#0f1d3a"/>

  <!-- Packing tape across the top-right corner -->
  <polygon points="2040,0 2190,0 2400,210 2400,360" fill="#b98a55"/>
  <polygon points="2070,0 2084,0 2400,316 2400,330" fill="#0f1d3a" fill-opacity="0.14"/>
  <polygon points="2146,0 2160,0 2400,240 2400,254" fill="#0f1d3a" fill-opacity="0.14"/>

  <!-- Headline: the one bold move -->
  <text class="d8" x="96" y="300" font-size="280" fill="#ffffff">PACKED.</text>
  <text class="d8" x="96" y="545" font-size="280" fill="#ffffff">SHIPPED.</text>
  <text class="d8" x="96" y="790" font-size="280" fill="#f2b705">DONE.</text>

  <!-- Logo slot (official Goin' Postal logo goes here) -->
  <rect x="1560" y="330" width="744" height="240" fill="#0f1d3a" stroke="#ffffff" stroke-width="4" stroke-dasharray="18 12"/>
  <text class="mono" x="1932" y="460" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="4">OFFICIAL LOGO</text>

  <!-- Services -->
  <text class="d6" x="1560" y="672" font-size="64" fill="#ffffff" letter-spacing="2">UPS · FEDEX · DHL · USPS</text>
  <text class="d6" x="1560" y="752" font-size="50" fill="#f2b705" letter-spacing="1">SHIPPING · PACKING · MAILBOXES</text>

  <!-- Location bar -->
  <rect x="0" y="860" width="2400" height="243" fill="#f2b705"/>
  <rect x="0" y="860" width="2400" height="10" fill="#0f1d3a" fill-opacity="0.25"/>
  <text class="d8" x="96" y="1024" font-size="120" fill="#0f1d3a" letter-spacing="1">FORSYTHE AVE &amp; N 18TH ST · MONROE</text>

  <!-- Turn arrow -->
  <rect x="2084" y="902" width="220" height="160" fill="#0f1d3a"/>
  <rect x="2124" y="960" width="96" height="44" fill="#ffffff"/>
  <polygon points="2206,922 2272,982 2206,1042" fill="#ffffff"/>
</svg>
