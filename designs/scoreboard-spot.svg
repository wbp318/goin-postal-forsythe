<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Touchdown? We Deliver. - Scoreboard Spot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .body { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0f1d3a"/>

  <!-- Logo slot (official logo to be placed here) -->
  <rect x="1560" y="56" width="284" height="150" fill="#0f1d3a" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1702" y="139" class="mono" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">OFFICIAL LOGO</text>

  <!-- Headline -->
  <text x="80" y="400" class="d8" font-size="280" fill="#ffffff" letter-spacing="2" textLength="1430" lengthAdjust="spacingAndGlyphs">TOUCHDOWN?</text>
  <text x="80" y="700" class="d8" font-size="280" fill="#f2b705" letter-spacing="2">WE DELIVER.</text>

  <!-- Goal line with yard hash marks -->
  <rect x="0" y="770" width="1920" height="10" fill="#ffffff"/>
  <g fill="#ffffff">
    <rect x="77" y="744" width="6" height="26"/>
    <rect x="173" y="744" width="6" height="26"/>
    <rect x="269" y="744" width="6" height="26"/>
    <rect x="365" y="744" width="6" height="26"/>
    <rect x="461" y="744" width="6" height="26"/>
    <rect x="557" y="744" width="6" height="26"/>
    <rect x="653" y="744" width="6" height="26"/>
    <rect x="749" y="744" width="6" height="26"/>
    <rect x="845" y="744" width="6" height="26"/>
    <rect x="941" y="744" width="6" height="26"/>
    <rect x="1037" y="744" width="6" height="26"/>
    <rect x="1133" y="744" width="6" height="26"/>
    <rect x="1229" y="744" width="6" height="26"/>
    <rect x="1325" y="744" width="6" height="26"/>
    <rect x="1421" y="744" width="6" height="26"/>
    <rect x="1517" y="744" width="6" height="26"/>
    <rect x="1613" y="744" width="6" height="26"/>
    <rect x="1709" y="744" width="6" height="26"/>
    <rect x="1805" y="744" width="6" height="26"/>
  </g>

  <!-- Services and location -->
  <text x="77" y="880" class="d8" font-size="60" fill="#ffffff" letter-spacing="2">SHIPPING · PACKING · MAILBOXES</text>
  <text x="1843" y="880" class="d6" font-size="60" fill="#ffffff" text-anchor="end" letter-spacing="2">UPS · FEDEX · DHL · USPS</text>
  <text x="77" y="980" class="d6" font-size="60" fill="#f2b705" letter-spacing="2">FORSYTHE AVE &amp; N 18TH ST · MONROE</text>
  <text x="1843" y="980" class="body" font-size="38" fill="#ffffff" text-anchor="end">Goin' Postal · Forsythe</text>
</svg>
