<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2200" width="1700" height="2200">
  <title>Goin' Postal Forsythe - holiday ship-by deadlines, Christmas 2026 (8.5 x 11 in)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .sans { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .sans6 { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; letter-spacing: 3px; }
  </style>

  <!-- Navy ground, white shipping label -->
  <rect x="0" y="0" width="1700" height="2200" fill="#0f1d3a"/>
  <rect x="70" y="70" width="1560" height="2060" fill="#ffffff"/>
  <rect x="90" y="90" width="1520" height="2020" fill="none" stroke="#17202d" stroke-width="6"/>

  <!-- Packing tape across the top-left corner -->
  <polygon points="20,250 250,20 340,110 110,340" fill="#b98a55" fill-opacity="0.92"/>
  <polygon points="20,250 250,20 258,28 28,258" fill="#9a7142" fill-opacity="0.9"/>
  <polygon points="102,332 332,102 340,110 110,340" fill="#9a7142" fill-opacity="0.9"/>

  <!-- Row 1: FROM + logo slot -->
  <text x="380" y="160" class="mono" font-size="26" fill="#1d4ed8">FROM</text>
  <text x="380" y="228" class="sans6" font-size="54" fill="#17202d">Goin' Postal · Forsythe</text>
  <text x="380" y="288" class="sans" font-size="38" fill="#17202d">Forsythe Ave &amp; N 18th St · Monroe, LA</text>
  <rect x="1190" y="120" width="380" height="190" fill="#ffffff" stroke="#17202d" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1380" y="224" class="mono" font-size="24" fill="#17202d" text-anchor="middle">OFFICIAL LOGO</text>
  <rect x="90" y="340" width="1520" height="8" fill="#17202d"/>

  <!-- Row 2: headline + Christmas routing block -->
  <text x="130" y="410" class="mono" font-size="26" fill="#1d4ed8">HOLIDAY DEADLINES · CHRISTMAS 2026</text>
  <text x="122" y="600" class="d8" font-size="220" fill="#17202d" textLength="700" lengthAdjust="spacingAndGlyphs">SHIP BY</text>
  <text x="130" y="650" class="sans6" font-size="34" fill="#5a6573">Last days to ship for holiday delivery</text>
  <rect x="1190" y="384" width="380" height="270" fill="#0f1d3a"/>
  <text x="1220" y="438" class="mono" font-size="24" fill="#f2b705">CHRISTMAS DAY</text>
  <text x="1220" y="530" class="d8" font-size="84" fill="#ffffff" textLength="320" lengthAdjust="spacingAndGlyphs">FRIDAY</text>
  <text x="1220" y="622" class="d8" font-size="84" fill="#f2b705" textLength="320" lengthAdjust="spacingAndGlyphs">DEC 25</text>
  <rect x="90" y="684" width="1520" height="8" fill="#17202d"/>

  <!-- Column labels -->
  <text x="130" y="738" class="mono" font-size="24" fill="#1d4ed8">CARRIER · SERVICE</text>
  <text x="1570" y="738" class="mono" font-size="24" fill="#1d4ed8" text-anchor="end">LAST DAY TO SHIP</text>


  <!-- USPS -->
  <rect x="130" y="760" width="1440" height="58" fill="#0f1d3a"/>
  <text x="154" y="804" class="d8" font-size="46" fill="#ffffff">USPS</text>
  <text x="1546" y="798" class="mono" font-size="22" fill="#f2b705" text-anchor="end">ARRIVES BY FRI, DEC 25</text>
  <text x="154" y="863" class="sans6" font-size="36" fill="#17202d">Ground Advantage</text>
  <text x="1546" y="870" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Thu, Dec 17</text>
  <rect x="154" y="882" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="929" class="sans6" font-size="36" fill="#17202d">Priority Mail</text>
  <text x="1546" y="936" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Fri, Dec 18</text>
  <rect x="154" y="948" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="995" class="sans6" font-size="36" fill="#17202d">Priority Mail Express</text>
  <text x="1546" y="1002" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Sat, Dec 19</text>

  <!-- FEDEX -->
  <rect x="130" y="1028" width="1440" height="58" fill="#0f1d3a"/>
  <text x="154" y="1072" class="d8" font-size="46" fill="#ffffff">FEDEX</text>
  <text x="1546" y="1066" class="mono" font-size="22" fill="#f2b705" text-anchor="end">ARRIVES BY THU, DEC 24</text>
  <text x="154" y="1121" class="sans6" font-size="36" fill="#17202d">Ground / Home Delivery</text>
  <text x="154" y="1143" class="sans" font-size="21" fill="#5a6573">Based on 5-day transit. Shorter routes can ship later; ask us.</text>
  <text x="1546" y="1138" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Thu, Dec 17</text>
  <rect x="154" y="1153" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1197" class="sans6" font-size="36" fill="#17202d">Express Saver</text>
  <text x="1546" y="1204" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Mon, Dec 21</text>
  <rect x="154" y="1216" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1263" class="sans6" font-size="36" fill="#17202d">2Day / 2Day AM</text>
  <text x="1546" y="1270" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Tue, Dec 22</text>
  <rect x="154" y="1282" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1319" class="sans6" font-size="36" fill="#17202d">Standard Overnight</text>
  <text x="154" y="1343" class="sans" font-size="21" fill="#5a6573">Also First and Priority Overnight</text>
  <text x="1546" y="1336" class="d8" font-size="54" fill="#0f1d3a" text-anchor="end">Wed, Dec 23</text>

  <!-- UPS -->
  <rect x="130" y="1362" width="1440" height="58" fill="#0f1d3a"/>
  <text x="154" y="1406" class="d8" font-size="46" fill="#ffffff">UPS</text>
  <text x="1546" y="1400" class="mono" font-size="22" fill="#f2b705" text-anchor="end">NOT YET ANNOUNCED *</text>
  <text x="154" y="1465" class="sans6" font-size="36" fill="#17202d">Ground</text>
  <rect x="1206" y="1428" width="340" height="50" fill="#ffffff" stroke="#17202d" stroke-width="3"/>
  <text x="1216" y="1447" class="mono" font-size="16" fill="#5a6573">WRITE IN</text>
  <rect x="154" y="1484" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1531" class="sans6" font-size="36" fill="#17202d">3 Day Select</text>
  <rect x="1206" y="1494" width="340" height="50" fill="#ffffff" stroke="#17202d" stroke-width="3"/>
  <text x="1216" y="1513" class="mono" font-size="16" fill="#5a6573">WRITE IN</text>
  <rect x="154" y="1550" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1597" class="sans6" font-size="36" fill="#17202d">2nd Day Air</text>
  <rect x="1206" y="1560" width="340" height="50" fill="#ffffff" stroke="#17202d" stroke-width="3"/>
  <text x="1216" y="1579" class="mono" font-size="16" fill="#5a6573">WRITE IN</text>
  <rect x="154" y="1616" width="1392" height="2" fill="#5a6573" fill-opacity="0.45"/>
  <text x="154" y="1663" class="sans6" font-size="36" fill="#17202d">Next Day Air</text>
  <rect x="1206" y="1626" width="340" height="50" fill="#ffffff" stroke="#17202d" stroke-width="3"/>
  <text x="1216" y="1645" class="mono" font-size="16" fill="#5a6573">WRITE IN</text>

  <!-- Yellow band: the one bold move -->
  <rect x="90" y="1712" width="1520" height="210" fill="#f2b705"/>
  <text x="1570" y="1762" class="mono" font-size="22" fill="#3b2c00" text-anchor="end">SHIPPING · PACKING · MAILBOXES</text>
  <text x="124" y="1888" class="d8" font-size="170" fill="#3b2c00" textLength="760" lengthAdjust="spacingAndGlyphs">SHIP EARLY.</text>
  <text x="1570" y="1888" class="d8" font-size="120" fill="#3b2c00" text-anchor="end" textLength="640" lengthAdjust="spacingAndGlyphs">WE'LL PACK IT.</text>
  <rect x="90" y="1922" width="1520" height="8" fill="#17202d"/>

  <!-- Footnotes -->
  <text x="130" y="1980" class="sans" font-size="27" fill="#17202d">* Dates not yet announced are written in by staff when carriers publish them.</text>
  <text x="130" y="2020" class="sans" font-size="27" fill="#17202d">Carrier dates for the contiguous US. Ask at the counter for Alaska, Hawaii and international.</text>
  <text x="130" y="2060" class="sans" font-size="23" fill="#5a6573">Carriers may change their dates. FedEx dates are for arrival by Thu, Dec 24; USPS by Fri, Dec 25.</text>
  <text x="1570" y="2090" class="mono" font-size="18" fill="#5a6573" text-anchor="end">UPS · FEDEX · DHL · USPS</text>
</svg>
