<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Promo Night Social Post: Goin' Postal Forsythe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .sans { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .sans6 { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; letter-spacing: 2px; }
  </style>

  <!-- Ground -->
  <rect x="0" y="0" width="1080" height="1080" fill="#0f1d3a"/>

  <!-- The label -->
  <rect x="60" y="60" width="960" height="960" fill="#ffffff" stroke="#17202d" stroke-width="6"/>

  <!-- Packing tape across top edge -->
  <rect x="440" y="36" width="200" height="56" fill="#b98a55" fill-opacity="0.85"/>
  <rect x="440" y="36" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>
  <rect x="440" y="88" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>

  <!-- ROW A: FROM + logo slot -->
  <text x="100" y="128" class="mono" font-size="20" fill="#1d4ed8">FROM</text>
  <text x="100" y="172" class="sans6" font-size="32" fill="#17202d">Goin' Postal · Forsythe</text>
  <text x="100" y="212" class="sans" font-size="25" fill="#17202d">Forsythe Ave &amp; N 18th St · Monroe</text>

  <rect x="690" y="100" width="290" height="120" fill="#ffffff" stroke="#17202d" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="835" y="167" class="mono" font-size="18" fill="#17202d" text-anchor="middle">OFFICIAL LOGO</text>

  <rect x="60" y="247" width="960" height="6" fill="#17202d"/>

  <!-- ROW B: the one bold move -->
  <rect x="60" y="253" width="960" height="300" fill="#f2b705"/>
  <text x="100" y="300" class="mono" font-size="20" fill="#3b2c00">MOCCASINS HOCKEY · SPONSORED BY GOIN' POSTAL</text>
  <text x="96" y="510" class="d8" font-size="200" fill="#3b2c00" textLength="884" lengthAdjust="spacingAndGlyphs">PROMO NIGHT</text>

  <rect x="60" y="553" width="960" height="6" fill="#17202d"/>

  <!-- ROW C: date / venue (editable) -->
  <text x="100" y="604" class="mono" font-size="20" fill="#1d4ed8">SERVICE DATE · DELIVER TO</text>
  <text x="980" y="604" class="mono" font-size="16" fill="#17202d" text-anchor="end">EDIT · DATE &amp; VENUE</text>
  <text x="100" y="670" class="d6" font-size="52" fill="#17202d" textLength="880" lengthAdjust="spacingAndGlyphs">SAT · DATE TBD · 7:05 PM · MONROE CIVIC CENTER</text>
  <rect x="100" y="684" width="880" height="2" fill="#1d4ed8" fill-opacity="0.5"/>

  <rect x="60" y="713" width="960" height="6" fill="#17202d"/>

  <!-- ROW D: code + services -->
  <text x="100" y="766" class="mono" font-size="20" fill="#1d4ed8">PROMO CODE</text>
  <text x="96" y="880" class="d8" font-size="120" fill="#0f1d3a" textLength="380" lengthAdjust="spacingAndGlyphs">MOCS10</text>
  <text x="100" y="934" class="sans" font-size="24" fill="#17202d">One per customer.</text>
  <text x="100" y="970" class="sans" font-size="24" fill="#17202d">Name + phone required.</text>

  <rect x="557" y="719" width="6" height="301" fill="#17202d"/>

  <text x="600" y="766" class="mono" font-size="20" fill="#1d4ed8">SERVICES</text>
  <text x="600" y="840" class="d8" font-size="56" fill="#0f1d3a" textLength="380" lengthAdjust="spacingAndGlyphs">SHIPPING · PACKING</text>
  <text x="600" y="904" class="d8" font-size="56" fill="#0f1d3a">MAILBOXES</text>
  <text x="600" y="966" class="mono" font-size="20" fill="#17202d">UPS · FEDEX · DHL · USPS</text>
</svg>
