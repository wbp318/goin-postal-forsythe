<?xml version="1.0" encoding="UTF-8"?>
<svg text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg" width="1100" height="1700" viewBox="0 0 1100 1700">
  <title>Promo Night Handout: Goin' Postal Forsythe (5.5 x 8.5 in)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .d8 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 800; text-transform: uppercase; }
    .d6 { font-family: 'Barlow Condensed', 'Arial Narrow', 'Avenir Next Condensed', Impact, sans-serif; font-weight: 600; text-transform: uppercase; }
    .sans { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .sans6 { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-weight: 500; letter-spacing: 2px; }
  </style>

  <!-- Navy ground, white shipping label -->
  <rect x="0" y="0" width="1100" height="1700" fill="#0f1d3a"/>
  <rect x="60" y="70" width="980" height="1560" fill="#ffffff" stroke="#17202d" stroke-width="6"/>

  <!-- Packing tape across top edge -->
  <rect x="450" y="44" width="200" height="56" fill="#b98a55" fill-opacity="0.85"/>
  <rect x="450" y="44" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>
  <rect x="450" y="96" width="200" height="4" fill="#9a7142" fill-opacity="0.85"/>

  <!-- ROW A: framing + logo slot -->
  <text x="100" y="150" class="mono" font-size="22" fill="#1d4ed8">PROMO NIGHT · ADMIT ONE</text>
  <text x="100" y="228" class="d6" font-size="66" fill="#17202d" textLength="580" lengthAdjust="spacingAndGlyphs">TONIGHT'S GAME IS</text>
  <text x="100" y="298" class="d6" font-size="66" fill="#17202d" textLength="580" lengthAdjust="spacingAndGlyphs">BROUGHT TO YOU BY</text>

  <rect x="730" y="120" width="270" height="190" fill="#ffffff" stroke="#17202d" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="865" y="221" class="mono" font-size="18" fill="#17202d" text-anchor="middle">OFFICIAL LOGO</text>

  <rect x="60" y="340" width="980" height="6" fill="#17202d"/>

  <!-- ROW B: the one bold move -->
  <rect x="60" y="346" width="980" height="300" fill="#f2b705"/>
  <text x="100" y="400" class="mono" font-size="20" fill="#3b2c00">FROM · GOIN' POSTAL · FORSYTHE</text>
  <text x="96" y="500" class="d8" font-size="118" fill="#3b2c00" textLength="908" lengthAdjust="spacingAndGlyphs">YOUR NEIGHBORS</text>
  <text x="96" y="576" class="d8" font-size="70" fill="#3b2c00" textLength="560" lengthAdjust="spacingAndGlyphs">ON FORSYTHE AVE</text>
  <text x="100" y="622" class="d6" font-size="30" fill="#3b2c00" textLength="380" lengthAdjust="spacingAndGlyphs">MONROE, LOUISIANA</text>

  <rect x="60" y="646" width="980" height="6" fill="#17202d"/>

  <!-- ROW C: clip-out coupon -->
  <rect x="100" y="690" width="900" height="390" fill="#ffffff" stroke="#0f1d3a" stroke-width="4" stroke-dasharray="16 10"/>
  <text x="140" y="748" class="mono" font-size="20" fill="#1d4ed8">CLIP · SHOW AT THE COUNTER</text>
  <text x="134" y="930" class="d8" font-size="190" fill="#0f1d3a" textLength="500" lengthAdjust="spacingAndGlyphs">MOCS10</text>
  <text x="140" y="1000" class="sans" font-size="26" fill="#17202d">Use this code at Goin' Postal on Forsythe.</text>
  <text x="140" y="1040" class="sans" font-size="22" fill="#5a6573">Thanks for coming out to the game.</text>

  <rect x="680" y="780" width="4" height="200" fill="#17202d"/>
  <text x="716" y="808" class="mono" font-size="20" fill="#1d4ed8">PROMO CODE</text>
  <text x="716" y="866" class="sans6" font-size="30" fill="#17202d">One per customer.</text>
  <text x="716" y="916" class="sans6" font-size="30" fill="#17202d">Name + phone</text>
  <text x="716" y="956" class="sans6" font-size="30" fill="#17202d">required.</text>

  <rect x="60" y="1120" width="980" height="6" fill="#17202d"/>

  <!-- ROW D: services -->
  <text x="100" y="1180" class="mono" font-size="20" fill="#1d4ed8">SERVICES</text>
  <text x="100" y="1266" class="d8" font-size="76" fill="#0f1d3a" textLength="900" lengthAdjust="spacingAndGlyphs">SHIPPING · PACKING · MAILBOXES</text>
  <text x="100" y="1322" class="mono" font-size="28" fill="#17202d">UPS · FEDEX · DHL · USPS</text>

  <rect x="60" y="1362" width="980" height="6" fill="#17202d"/>

  <!-- ROW E: location -->
  <text x="100" y="1422" class="mono" font-size="20" fill="#1d4ed8">DELIVER TO</text>
  <text x="100" y="1518" class="d8" font-size="92" fill="#17202d" textLength="900" lengthAdjust="spacingAndGlyphs">FORSYTHE AVE &amp; N 18TH ST</text>
  <text x="100" y="1572" class="sans" font-size="26" fill="#17202d">Monroe · Locally owned and operated</text>
  <text x="1000" y="1606" class="mono" font-size="16" fill="#17202d" text-anchor="end">PKG 1 OF 1</text>
</svg>
